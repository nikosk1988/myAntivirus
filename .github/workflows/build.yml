name: Build Tauri App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies & Build Tauri
      shell: bash
      run: |
        unzip -o src-tauri.zip
        
        # Καθαρισμός τυχόν άκυρου Cargo.toml στο root
        rm -f Cargo.toml

        # Δημιουργία φακέλου icons
        mkdir -p src-tauri/icons

        # Δημιουργία ενός έγκυρου, ελάχιστου icon.ico απευθείας σε Base64 (Windows-compatible)
        python3 -c "
        ico_data = b'\x00\x00\x01\x00\x01\x00\x10\x10\x00\x00\x01\x00\x18\x00h\x00\x00\x00&\x00\x00\x00(\x00\x00\x00\x10\x00\x00\x00 \x00\x00\x00\x01\x00\x18\x00\x00\x00\x00\x000\x00\x00\x00\xc4\x0e\x00\x00\xc4\x0e\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xff\xff\xff\x00'
        with open('src-tauri/icons/icon.ico', 'wb') as f:
            f.write(ico_data)
        "

        # Δημιουργία πλήρους Cargo.toml
        mkdir -p src-tauri
        cat << 'EOF' > src-tauri/Cargo.toml
        [package]
        name = "shield-desktop"
        version = "0.1.0"
        edition = "2021"

        [dependencies]
        tauri = { version = "1", features = [ "api-all" ] }
        serde = { version = "1", features = [ "derive" ] }
        serde_json = "1"
        log = "0.4"
        env_logger = "0.10"

        [build-dependencies]
        tauri-build = { version = "1" }
        EOF

        # Δημιουργία του build.rs
        cat << 'EOF' > src-tauri/build.rs
        fn main() {
            tauri_build::build()
        }
        EOF

        # Δημιουργία συμβατού tauri.conf.json
        cat << 'EOF' > src-tauri/tauri.conf.json
        {
          "build": {
            "distDir": "../ui",
            "devPath": "http://localhost:1420",
            "beforeDevCommand": "",
            "beforeBuildCommand": ""
          },
          "package": {
            "productName": "shield-desktop",
            "version": "0.1.0"
          },
          "tauri": {
            "allowlist": {
              "all": true
            },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "identifier": "com.shield.desktop",
              "icon": [
                "icons/icon.ico"
              ]
            },
            "security": {
              "csp": null
            },
            "windows": [
              {
                "title": "Shield Desktop",
                "width": 800,
                "height": 600
              }
            ]
          }
        }
        EOF
        
        cd src-tauri
        cargo build --release

    - name: Upload Release Binary
      uses: actions/upload-artifact@v4
      with:
        name: ShieldCore-Windows-Binary
        path: src-tauri/target/release/shield-desktop.exe
