# Δημιουργία διορθωμένου tauri.conf.json χωρίς devPath για production build
        cat << 'EOF' > src-tauri/tauri.conf.json
        {
          "build": {
            "distDir": "./ui",
            "beforeDevCommand": "",
            "beforeBuildCommand": ""
          },
          "package": {
            "productName": "ShieldCoreAntivirus",
            "version": "1.0.0"
          },
          "tauri": {
            "allowlist": {
              "all": true
            },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "identifier": "com.shield.core.desktop",
              "icon": [
                "icons/icon.ico"
              ]
            },
            "security": {
              "csp": null
            },
            "windows": [
              {
                "title": "Shield Core Antivirus",
                "width": 1150,
                "height": 780,
                "resizable": true
              }
            ]
          }
        }
        EOF
