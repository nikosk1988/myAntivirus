name: Build Tauri App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies & Build Tauri
      shell: bash
      run: |
        unzip -o src-tauri.zip
        
        # Αν δεν υπάρχει Cargo.toml μέσα στο src-tauri, το δημιουργούμε αυτόματα
        if [ ! -f "src-tauri/Cargo.toml" ]; then
          echo '[package]' > src-tauri/Cargo.toml
          echo 'name = "shield-desktop"' >> src-tauri/Cargo.toml
          echo 'version = "0.1.0"' >> src-tauri/Cargo.toml
          echo 'edition = "2021"' >> src-tauri/Cargo.toml
          echo '' >> src-tauri/Cargo.toml
          echo '[dependencies]' >> src-tauri/Cargo.toml
          echo 'tauri = { version = "1", features = [ "all" ] }' >> src-tauri/Cargo.toml
          echo 'serde = { version = "1", features = [ "derive" ] }' >> src-tauri/Cargo.toml
          echo 'serde_json = "1"' >> src-tauri/Cargo.toml
        fi
        
        cd src-tauri
        cargo build --release

    - name: Upload Release Binary
      uses: actions/upload-artifact@v4
      with:
        name: ShieldCore-Windows-Binary
        path: src-tauri/target/release/shield-desktop.exe
