name: Build Stable EDR Binary

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust Project
      shell: bash
      run: |
        unzip -o src-tauri.zip
        
        # Αντικατάσταση ή δημιουργία καθαρού Cargo.toml για το EDR backend
        cat << 'EOF' > Cargo.toml
        [package]
        name = "shield-core"
        version = "0.2.0"
        edition = "2021"

        [dependencies]
        tokio = { version = "1", features = ["full"] }
        sysinfo = "0.30"
        chrono = "0.4"
        notify = "6.1"
        log = "0.4"
        env_logger = "0.10"
        EOF

        cargo build --release

    - name: Upload Stable Binary
      uses: actions/upload-artifact@v4
      with:
        name: ShieldCore-Stable-Binary
        path: target/release/shield-core.exe
