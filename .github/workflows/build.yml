name: Build Tauri App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies & Build Tauri
      shell: bash
      run: |
        unzip -o src-tauri.zip
        
        # Καθαρισμός τυχόν άκυρου Cargo.toml στο root
        rm -f Cargo.toml
        
        # Δημιουργία καθαρού Cargo.toml χωρίς ανύπαρκτα features
        mkdir -p src-tauri
        cat << 'EOF' > src-tauri/Cargo.toml
        [package]
        name = "shield-desktop"
        version = "0.1.0"
        edition = "2021"

        [dependencies]
        tauri = { version = "1" }
        serde = { version = "1", features = [ "derive" ] }
        serde_json = "1"
        EOF
        
        cd src-tauri
        cargo build --release

    - name: Upload Release Binary
      uses: actions/upload-artifact@v4
      with:
        name: ShieldCore-Windows-Binary
        path: src-tauri/target/release/shield-desktop.exe
